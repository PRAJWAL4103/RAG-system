<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RAG System — Ask questions about your documents using AI-powered retrieval and generation.">
    <title>RAG System — AI Document Q&A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Animated background particles -->
    <div class="bg-particles" id="bgParticles"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                        <circle cx="12" cy="10" r="2"/>
                        <path d="M12 12v3"/>
                    </svg>
                </div>
                <h1>RAG<span class="accent">System</span></h1>
            </div>
            <div class="header-stats" id="headerStats">
                <div class="stat-badge" id="docCountBadge">
                    <span class="stat-dot"></span>
                    <span id="docCount">0 documents</span>
                </div>
                <div class="stat-badge" id="chunkCountBadge">
                    <span id="chunkCount">0 chunks</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main content -->
    <main class="main">
        <!-- Upload section -->
        <section class="section upload-section" id="uploadSection">
            <div class="section-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    Upload Documents
                </h2>
                <button class="btn btn-danger btn-sm" id="clearAllBtn" title="Clear all documents">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                    </svg>
                    Clear All
                </button>
            </div>

            <div class="drop-zone" id="dropZone">
                <div class="drop-zone-content">
                    <div class="drop-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <p class="drop-text">Drag & drop files here</p>
                    <p class="drop-subtext">or click to browse</p>
                    <p class="drop-formats">Supports TXT, PDF, MD files</p>
                </div>
                <input type="file" id="fileInput" multiple accept=".txt,.pdf,.md,.markdown" hidden>
            </div>

            <!-- Upload progress -->
            <div class="upload-results" id="uploadResults" hidden></div>

            <!-- Document list -->
            <div class="document-list" id="documentList" hidden>
                <h3>Indexed Documents</h3>
                <ul id="docListItems"></ul>
            </div>
        </section>

        <!-- Query section -->
        <section class="section query-section" id="querySection">
            <div class="section-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    Ask a Question
                </h2>
            </div>

            <div class="query-input-wrapper">
                <textarea
                    id="queryInput"
                    class="query-input"
                    placeholder="Ask anything about your documents..."
                    rows="3"
                ></textarea>
                <button class="btn btn-primary query-submit" id="querySubmit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                    Ask
                </button>
            </div>

            <!-- Answer display -->
            <div class="answer-container" id="answerContainer" hidden>
                <div class="answer-header">
                    <div class="answer-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/>
                            <path d="M12 16v.01"/>
                            <path d="M12 12a2 2 0 0 0 1.71-3.06 2 2 0 0 0-3.42 0A2 2 0 0 0 12 12Z"/>
                        </svg>
                    </div>
                    <h3>Answer</h3>
                </div>
                <div class="answer-text" id="answerText"></div>
                <div class="sources-section" id="sourcesSection" hidden>
                    <h4>Sources</h4>
                    <div class="sources-list" id="sourcesList"></div>
                </div>
            </div>

            <!-- Loading state -->
            <div class="loading-container" id="loadingContainer" hidden>
                <div class="loading-spinner">
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                </div>
                <p class="loading-text">Searching documents & generating answer...</p>
            </div>

            <!-- Conversation history -->
            <div class="history-section" id="historySection" hidden>
                <h3>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    Previous Questions
                </h3>
                <div class="history-list" id="historyList"></div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Powered by <strong>Google Gemini</strong> & <strong>ChromaDB</strong></p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
